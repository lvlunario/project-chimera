name: test

on:
  pull_request:
  push:
    branches:
      - main
      - magnum-opus/development

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare offline wheel build tools
        env:
          PIP_NO_INPUT: "1"
        run: python -m pip install --disable-pip-version-check "setuptools>=77" wheel

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Prepare and inspect exact M4 review rehearsal
        run: |
          CANDIDATE_SHA=$(git rev-parse HEAD)
          status=0
          python -m examples.release_review_rehearsal \
            --candidate-commit "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/chimera-m4-review" || status=$?
          if [ -f "$RUNNER_TEMP/chimera-m4-review/review-rehearsal.json" ]; then
            python -m json.tool \
              "$RUNNER_TEMP/chimera-m4-review/review-rehearsal.json"
          fi
          if [ -f "$RUNNER_TEMP/chimera-m4-review/chimera-m4-evidence.zip" ]; then
            python -m examples.release_candidate_packet inspect \
              "$RUNNER_TEMP/chimera-m4-review/chimera-m4-evidence.zip" \
              || status=$?
          fi
          if [ -f "$RUNNER_TEMP/chimera-m4-review/review-rehearsal.json" ]; then
            python -m examples.release_review_archive build \
              --rehearsal "$RUNNER_TEMP/chimera-m4-review" \
              --output "$RUNNER_TEMP/chimera-m4-review.zip" \
              || status=$?
          fi
          if [ -f "$RUNNER_TEMP/chimera-m4-review.zip" ]; then
            python -m examples.release_review_archive inspect \
              "$RUNNER_TEMP/chimera-m4-review.zip" \
              || status=$?
          fi
          exit "$status"

      - name: Verify isolated wheel install
        run: scripts/verify_clean_install.sh

  browser-dashboard:
    name: Chromium dashboard journey
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned browser test tooling
        env:
          PIP_NO_INPUT: "1"
        run: python -m pip install --disable-pip-version-check "playwright==1.55.0"

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run real-browser dashboard journey
        run: python -m unittest discover -s browser_tests -v
