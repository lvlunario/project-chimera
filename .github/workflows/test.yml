name: test

on:
  pull_request:
  push:
    branches:
      - main
      - magnum-opus/development

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare offline wheel build tools
        env:
          PIP_NO_INPUT: "1"
        run: python -m pip install --disable-pip-version-check "setuptools>=77" wheel

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Verify isolated wheel install
        run: scripts/verify_clean_install.sh
